name: Windows build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Build, test, verify licenses, and package
        shell: pwsh
        run: ./scripts/build.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: Widgets-win-x64
          path: |
            artifacts/Widgets-win-x64.zip
            artifacts/Widgets-win-x64.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Widgets-win-x64
          path: release
      - name: Create draft release for reviewed tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/Widgets-win-x64.zip release/Widgets-win-x64.sha256 --repo $env:GITHUB_REPOSITORY --draft --generate-notes
